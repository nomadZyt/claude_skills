<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>众安车险·本周战报 4.6-4.12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Noto Sans SC", sans-serif; background: #ffffff; color: #0f172a; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; }
        .card { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 16px; }
        .highlight { color: #3b82f6; }
        .accent { color: #10b981; }
        .warn { color: #f97316; }
    </style>
</head>
<body>
    <div class="container space-y-4">
        <div class="card p-5 text-center">
            <h1 class="text-2xl font-bold mb-2">众安车险·本周数据战报</h1>
            <div class="text-lg" style="color:#64748b">2026.04.06 - 04.12</div>
        </div>

        <div class="card p-5">
            <h3 class="text-lg font-bold mb-4">📊 本周核心数据</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="text-center p-3 bg-slate-50 rounded-lg">
                    <div class="text-2xl font-bold highlight">3,062</div>
                    <div class="text-sm" style="color:#64748b">加V用户</div>
                </div>
                <div class="text-center p-3 bg-slate-50 rounded-lg">
                    <div class="text-2xl font-bold accent">22.82万</div>
                    <div class="text-sm" style="color:#64748b">保费产出</div>
                </div>
            </div>
        </div>

        <div class="card p-5">
            <h3 class="text-lg font-bold mb-4">🔥 渠道详情</h3>
            <div class="space-y-3 text-base">
                <div class="bg-slate-50 rounded-lg p-3">
                    <div class="font-bold mb-2" style="color:#0f172a">🎬 抖音</div>
                    <div class="text-sm" style="color:#64748b">
                        <div>+V <span class="highlight">3,062</span>，环比持平</div>
                        <div>直播间加V成本 <span class="warn">21.45元</span>，环比提升 <span class="warn">8.8%</span></div>
                        <div>保费产出 <span class="accent">22.82万</span>（直接保费 <span class="highlight">6.03万</span>），环比提升 <span class="accent">51.95%</span></div>
                        <div>ROI <span class="accent">3.3</span></div>
                    </div>
                </div>
                <div class="bg-slate-50 rounded-lg p-3">
                    <div class="font-bold mb-2" style="color:#0f172a">🗺️ 百度地图</div>
                    <div class="text-sm" style="color:#64748b">
                        <div>预估 <span class="highlight">4.24-4.30</span> 上线浙江（除宁波）、上海地区语音包</div>
                        <div>浙江地区3天/次（仅开始/仅结束），上海地区（开始+结束）</div>
                        <div>预估曝光 <span class="highlight">467万</span> 次</div>
                        <div>总消耗 <span class="warn">16.98万</span>（百度报价19.3万，代理8.8折）</div>
                        <div>CPM <span class="highlight">36元</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center py-3 text-sm" style="color:#94a3b8">
            众安车险品牌组 · 每周更新
        </div>
    </div>
</body>
</html>
